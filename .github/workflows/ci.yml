name: CI

on:
  push:
    branches: [master, next]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Builds the package, then checks it with publint and attw.
      - run: pnpm build
      - run: pnpm typecheck
      # The plain Vue consumer: resolver auto-import against the built package.
      - run: pnpm --filter spatial-playground build
      - run: pnpm --filter spatial-playground exec vue-tsc --noEmit
      - run: pnpm test:unit

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Runs in Chromium, Firefox and WebKit (CI is set).
      - run: pnpm test:browser

  nuxt:
    name: Nuxt ${{ matrix.compatibility }} (compatibility)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compatibility: ['4', '5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The hydration test drives the fixture app in a real browser.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:nuxt
        env:
          NUXT_COMPATIBILITY_VERSION: ${{ matrix.compatibility }}
