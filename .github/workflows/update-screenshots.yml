name: Update screenshots

# Regenerates the visual regression reference images on the chosen branch and
# commits them. Run it from the Actions tab after an intended visual change.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update references
    # Must match the visual job in ci.yml.
    runs-on: ubuntu-24.04
    if: github.ref_name != github.event.repository.default_branch
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:visual --update
      - name: Commit changed references
        run: |
          if [ -z "$(git status --porcelain -- test/visual)" ]; then
            echo "Reference images are up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/visual
          git commit -m 'test: update visual references'
          git push
          echo "Committed updated reference images to \`${{ github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"
